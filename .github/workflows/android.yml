name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify website JavaScript syntax
        run: |
          node --check docs/i18n.js
          node --check docs/script.js

  verify:
    runs-on: ubuntu-latest
    env:
      # ApkFlinger 使用公共 ForkJoinPool 并行读入待压缩文件，单独限制其峰值。
      JAVA_TOOL_OPTIONS: -Djava.util.concurrent.ForkJoinPool.common.parallelism=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 每个阶段退出 Gradle JVM，避免编译/Lint 的堆内状态累积到 APK 打包阶段。
      # --max-workers 约束 Gradle worker，公共线程池由上面的 JVM 参数单独约束。
      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest --stacktrace
      - name: Run Android Lint
        run: ./gradlew --no-daemon --max-workers=2 lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug --stacktrace
